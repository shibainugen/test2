<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>じゃんけんゲーム 🎮</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✊</text></svg>">
</head>
<body>
  <div class="game-card">
    <h1>✊✌️🖐️ じゃんけんゲーム</h1>
    <p class="subtitle">手を選んでコンピューターと勝負しよう！</p>

    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">あなた</span>
        <span id="player-score" class="score-value">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">あいこ</span>
        <span id="draw-score" class="score-value">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">コンピューター</span>
        <span id="computer-score" class="score-value">0</span>
      </div>
    </div>

    <div class="battle-area">
      <div class="hand-display">
        <span class="hand-emoji" id="player-hand">❓</span>
        <span class="hand-name">あなた</span>
      </div>
      <div class="vs">VS</div>
      <div class="hand-display">
        <span class="hand-emoji" id="computer-hand">❓</span>
        <span class="hand-name">コンピューター</span>
      </div>
    </div>

    <p id="result-message" class="result-message">手を選んでね！</p>

    <div class="buttons">
      <button class="hand-button" data-hand="rock">
        <span class="btn-emoji">✊</span>
        <span>グー</span>
      </button>
      <button class="hand-button" data-hand="scissors">
        <span class="btn-emoji">✌️</span>
        <span>チョキ</span>
      </button>
      <button class="hand-button" data-hand="paper">
        <span class="btn-emoji">🖐️</span>
        <span>パー</span>
      </button>
    </div>

    <button id="reset-button" class="reset-button">スコアをリセット</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
